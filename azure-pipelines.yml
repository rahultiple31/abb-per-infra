trigger: none

pr: none

parameters:
  - name: targetEnvironment
    displayName: Target environment
    type: string
    default: dev
    values:
      - dev
      - uat

  - name: targetRegion
    displayName: Target region
    type: string
    default: all
    values:
      - all
      - us-east-1
      - eu-central-1
      - ap-southeast-1

  - name: targetModule
    displayName: Target module
    type: string
    default: connect
    values:
      - connect
      - ec2

  - name: terraformAction
    displayName: Terraform action
    type: string
    default: plan
    values:
      - plan
      - apply

variables:
  terraformVersion: '1.10.0'
  workingDirectory: 'environments/${{ parameters.targetEnvironment }}'
  backendBucket: 'bts-cloud-terraform-state'
  backendKey: 'terraform-state/${{ parameters.targetEnvironment }}/${{ parameters.targetRegion }}/${{ parameters.targetModule }}/terraform.tfstate'
  backendRegion: 'us-east-1'
  connectAdminUserEnabled: 'false'
  connectAdminFirstName: ''
  connectAdminLastName: ''
  connectAdminUsername: ''
  connectAdminEmail: ''
  planArtifactName: 'terraform-plan-${{ parameters.targetEnvironment }}-${{ parameters.targetRegion }}-${{ parameters.targetModule }}'

stages:
  - stage: plan
    displayName: Plan ${{ parameters.targetEnvironment }} ${{ parameters.targetRegion }} ${{ parameters.targetModule }}
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
    jobs:
      - job: terraform_plan
        displayName: Terraform Plan ${{ parameters.targetEnvironment }} ${{ parameters.targetRegion }} ${{ parameters.targetModule }}
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: $(terraformVersion)

          - script: |
              set -euo pipefail

              case '${{ parameters.targetRegion }}:${{ parameters.targetModule }}' in
                all:connect)
                  TF_TARGET_ARGS='-target=module.connect_us_east_1[0] -target=module.connect_eu_central_1[0] -target=module.connect_ap_southeast_1[0]'
                  ;;
                all:ec2)
                  TF_TARGET_ARGS='-target=module.ec2_test_us_east_1[0] -target=module.ec2_test_eu_central_1[0] -target=module.ec2_test_ap_southeast_1[0]'
                  ;;
                us-east-1:connect)
                  TF_TARGET_ARGS='-target=module.connect_us_east_1[0]'
                  ;;
                us-east-1:ec2)
                  TF_TARGET_ARGS='-target=module.ec2_test_us_east_1[0]'
                  ;;
                eu-central-1:connect)
                  TF_TARGET_ARGS='-target=module.connect_eu_central_1[0]'
                  ;;
                eu-central-1:ec2)
                  TF_TARGET_ARGS='-target=module.ec2_test_eu_central_1[0]'
                  ;;
                ap-southeast-1:connect)
                  TF_TARGET_ARGS='-target=module.connect_ap_southeast_1[0]'
                  ;;
                ap-southeast-1:ec2)
                  TF_TARGET_ARGS='-target=module.ec2_test_ap_southeast_1[0]'
                  ;;
                *)
                  echo "Unsupported target region and module combination: ${{ parameters.targetRegion }} ${{ parameters.targetModule }}"
                  exit 1
                  ;;
              esac

              case '${{ parameters.targetEnvironment }}' in
                dev)
                  AWS_ROLE_ARN='$(AWS_DEV_OIDC_ROLE_ARN)'
                  ;;
                uat)
                  AWS_ROLE_ARN='$(AWS_UAT_OIDC_ROLE_ARN)'
                  ;;
              esac

              if [ -z "$AWS_ROLE_ARN" ] || [[ "$AWS_ROLE_ARN" == \$\(* ]]; then
                echo "AWS OIDC role ARN is not configured for ${{ parameters.targetEnvironment }}."
                exit 1
              fi

              OIDC_RESPONSE="$(curl -sS \
                -X POST \
                -H "Authorization: Bearer ${SYSTEM_ACCESSTOKEN}" \
                -H "Content-Length: 0" \
                "${SYSTEM_OIDCREQUESTURI}?api-version=7.1-preview.1")"
              OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | python3 -c 'import json, sys; print(json.load(sys.stdin)["oidcToken"])')"
              AWS_WEB_IDENTITY_TOKEN_FILE="$(Agent.TempDirectory)/aws-oidc-token"
              printf '%s' "$OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"

              export AWS_ROLE_ARN
              export AWS_WEB_IDENTITY_TOKEN_FILE
              export AWS_ROLE_SESSION_NAME="azure-pipelines-${{ parameters.targetEnvironment }}-$(Build.BuildId)"

              terraform init -reconfigure \
                -backend-config="bucket=$(backendBucket)" \
                -backend-config="key=$(backendKey)" \
                -backend-config="region=$(backendRegion)" \
                -backend-config="encrypt=true"

              terraform fmt -recursive ../..
              terraform validate
              terraform plan -var='enabled_modules=["${{ parameters.targetModule }}"]' ${TF_TARGET_ARGS} -out=tfplan
            displayName: Terraform Init, Validate, and Plan
            workingDirectory: $(workingDirectory)
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
              TF_VAR_connect_admin_user_enabled: $(connectAdminUserEnabled)
              TF_VAR_connect_admin_first_name: $(connectAdminFirstName)
              TF_VAR_connect_admin_last_name: $(connectAdminLastName)
              TF_VAR_connect_admin_username: $(connectAdminUsername)
              TF_VAR_connect_admin_password: $(CONNECT_ADMIN_PASSWORD)
              TF_VAR_connect_admin_email: $(connectAdminEmail)

          - publish: $(workingDirectory)/tfplan
            displayName: Publish Plan
            artifact: $(planArtifactName)

  - stage: apply
    displayName: Apply ${{ parameters.terraformAction }} ${{ parameters.targetEnvironment }} ${{ parameters.targetRegion }} ${{ parameters.targetModule }}
    dependsOn: plan
    condition: and(succeeded(), eq('${{ parameters.terraformAction }}', 'apply'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: terraform_apply
        displayName: Terraform Apply ${{ parameters.terraformAction }} ${{ parameters.targetEnvironment }} ${{ parameters.targetRegion }} ${{ parameters.targetModule }}
        environment: ${{ parameters.targetEnvironment }}
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@1
                  displayName: Install Terraform
                  inputs:
                    terraformVersion: $(terraformVersion)

                - download: current
                  displayName: Download Plan
                  artifact: $(planArtifactName)

                - script: |
                    set -euo pipefail

                    case '${{ parameters.targetEnvironment }}' in
                      dev)
                        AWS_ROLE_ARN='$(AWS_DEV_OIDC_ROLE_ARN)'
                        ;;
                      uat)
                        AWS_ROLE_ARN='$(AWS_UAT_OIDC_ROLE_ARN)'
                        ;;
                    esac

                    if [ -z "$AWS_ROLE_ARN" ] || [[ "$AWS_ROLE_ARN" == \$\(* ]]; then
                      echo "AWS OIDC role ARN is not configured for ${{ parameters.targetEnvironment }}."
                      exit 1
                    fi

                    OIDC_RESPONSE="$(curl -sS \
                      -X POST \
                      -H "Authorization: Bearer ${SYSTEM_ACCESSTOKEN}" \
                      -H "Content-Length: 0" \
                      "${SYSTEM_OIDCREQUESTURI}?api-version=7.1-preview.1")"
                    OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | python3 -c 'import json, sys; print(json.load(sys.stdin)["oidcToken"])')"
                    AWS_WEB_IDENTITY_TOKEN_FILE="$(Agent.TempDirectory)/aws-oidc-token"
                    printf '%s' "$OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"

                    export AWS_ROLE_ARN
                    export AWS_WEB_IDENTITY_TOKEN_FILE
                    export AWS_ROLE_SESSION_NAME="azure-pipelines-${{ parameters.targetEnvironment }}-$(Build.BuildId)"

                    terraform init -reconfigure \
                      -backend-config="bucket=$(backendBucket)" \
                      -backend-config="key=$(backendKey)" \
                      -backend-config="region=$(backendRegion)" \
                      -backend-config="encrypt=true"

                    terraform apply -auto-approve "$(Pipeline.Workspace)/$(planArtifactName)/tfplan"
                  displayName: Terraform Apply
                  workingDirectory: $(workingDirectory)
                  env:
                    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                    SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
